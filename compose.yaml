name: verstak

# Verstak shares its server with other products, so every service is capped and
# yields first: a low CPU weight (cpu_shares) and a higher OOM score than anything else.
services:
  mongo:
    cpu_shares: 256
    oom_score_adj: 500
    build: ./deploy/mongo
    entrypoint: ["bash", "/opt/verstak/entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: verstak_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run python3 scripts/setup_env.py}
      MONGO_CACHE_GB: ${MONGO_CACHE_GB:-0.25}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    mem_limit: 768m
    cpus: 1
    networks: [database]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "/opt/verstak/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mongo-init:
    cpu_shares: 256
    oom_score_adj: 500
    build: ./deploy/mongo
    depends_on:
      mongo: {condition: service_healthy}
    environment:
      MONGO_INITDB_ROOT_USERNAME: verstak_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run python3 scripts/setup_env.py}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Run python3 scripts/setup_env.py}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-verstak}
    entrypoint: ["bash", "/opt/verstak/init.sh"]
    mem_limit: 256m
    networks: [database]
    restart: "no"

  api:
    cpu_shares: 256
    oom_score_adj: 500
    build: ./backend
    mem_limit: 384m
    cpus: 1
    depends_on:
      mongo-init: {condition: service_completed_successfully}
    environment:
      MONGODB_URI: mongodb://verstak_app:${MONGO_APP_PASSWORD}@mongo:27017/${MONGODB_DATABASE:-verstak}?authSource=${MONGODB_DATABASE:-verstak}&replicaSet=rs0
      MONGODB_DATABASE: ${MONGODB_DATABASE:-verstak}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      APP_ENV: ${APP_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
    networks: [database, frontend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    cpu_shares: 256
    oom_score_adj: 500
    build: ./frontend
    mem_limit: 384m
    cpus: 1
    environment:
      API_INTERNAL_ORIGIN: http://api:8000
    networks: [frontend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    cpu_shares: 256
    oom_score_adj: 500
    build: ./deploy/gateway
    mem_limit: 64m
    cpus: 0.5
    depends_on:
      api: {condition: service_healthy}
      frontend: {condition: service_healthy}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    networks: [frontend]
    restart: unless-stopped

volumes:
  mongo_data:
  mongo_config:

networks:
  database: {internal: true}
  frontend:
