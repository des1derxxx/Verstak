name: Checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/setup_env.py
      - run: docker compose build
      - name: Verify a fresh Compose stack completes initialization
        run: |
          timeout 180s docker compose up -d
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8080/api/health
          python3 scripts/smoke_stack.py --exercise
      - name: Verify gateway recovers after application containers are replaced
        run: |
          docker compose up -d --no-deps --force-recreate --wait frontend api
          for attempt in $(seq 1 10); do
            if python3 scripts/smoke_stack.py; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Clean up test containers and volumes
        if: always()
        run: docker compose down --volumes
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: corepack enable && pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm format:check && pnpm typecheck && pnpm test && pnpm build
        working-directory: frontend
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
      - name: Start MongoDB replica set for integration tests
        run: |
          docker run -d --name verstak-mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec verstak-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec verstak-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 60); do
            if docker exec verstak-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify policies and persistence against real MongoDB
        env:
          VERSTAK_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
        run: python -m pytest backend/tests -q
