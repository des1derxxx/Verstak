server {
    listen 8080;
    server_name _;
    client_max_body_size 10m;
    # Containers can get new addresses after an independent rebuild.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream http://api:8000;
    set $frontend_upstream http://frontend:3000;
    # Behind the server's HTTPS proxy the client address comes in X-Forwarded-For.
    # Only private and loopback peers are trusted: the port is published on
    # 127.0.0.1, and the API rate-limits sign-ins by this address.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }
}
